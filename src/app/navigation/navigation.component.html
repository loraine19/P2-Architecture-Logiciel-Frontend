<nav
  class="navbar navbar-expand-lg navbar-light bg-light m-2 p-3 rounded border"
>
  <a class="navbar-brand" href="#">Etudiant Frontend </a>
  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#navbarSupportedContent"
    aria-controls="navbarSupportedContent"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <li class="nav-item" *ngIf="userService.isLoggedIn$ | async">
        <a
          class="nav-link"
          [routerLink]="['/']"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Home</a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          [routerLink]="['/register']"
          routerLinkActive="active"
          >Register</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/login']" routerLinkActive="active">
          Login
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/test']" routerLinkActive="active">
          Test
        </a>
      </li>
    </ul>
    <button
      *ngIf="userService.isLoggedIn$ | async"
      class="btn btn-outline-danger my-2 my-sm-0"
      (click)="userService.logout()"
    >
      Logout
    </button>
  </div>
</nav>
