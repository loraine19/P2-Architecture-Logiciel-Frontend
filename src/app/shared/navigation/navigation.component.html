<div class="top-bar">
  <div class="brand-section">
    <a class="brand-link" [routerLink]="['/home']">
      <mat-icon class="brand-icon">school</mat-icon>
      {{ userFirstName() }}
    </a>
  </div>
  <button
    mat-icon-button
    class="menu-toggle-btn"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen"
    aria-label="Toggle navigation"
  >
    <mat-icon [class.open]="isMenuOpen">
      {{ isMenuOpen ? "close" : "menu" }}
    </mat-icon>
  </button>
</div>

<div
  class="side-menu-overlay"
  [class.show]="isMenuOpen"
  (click)="closeMenu()"
></div>

<nav class="side-menu" [class.open]="isMenuOpen">
  <div class="menu-header">
    <h3>Menu</h3>
    <button
      mat-icon-button
      class="close-btn"
      (click)="closeMenu()"
      aria-label="Close menu"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <ul class="menu-items">
    <li class="menu-item">
      <a
        class="menu-link"
        [routerLink]="['/home']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        <mat-icon class="menu-icon">home</mat-icon>
        <span class="menu-text">Home</span>
      </a>
    </li>

    @if (!isAuthenticated()) {
      <li class="menu-item">
        <a
          class="menu-link"
          [routerLink]="['/register']"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <mat-icon class="menu-icon">person_add</mat-icon>
          <span class="menu-text">Register</span>
        </a>
      </li>
      <li class="menu-item">
        <a
          class="menu-link"
          [routerLink]="['/login']"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <mat-icon class="menu-icon">login</mat-icon>
          <span class="menu-text">Login</span>
        </a>
      </li>
    }

    @if (isAuthenticated()) {
      <li class="menu-item">
        <a
          class="menu-link"
          [routerLink]="['/studentCreate']"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <mat-icon class="menu-icon">add_circle</mat-icon>
          <span class="menu-text">Create Student</span>
        </a>
      </li>
      <li class="menu-item">
        <a
          class="menu-link"
          [routerLink]="['/studentList']"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <mat-icon class="menu-icon">list</mat-icon>
          <span class="menu-text">Student List</span>
        </a>
      </li>
    }
  </ul>

  @if (isAuthenticated()) {
    <div class="menu-footer">
      <button
        mat-button
        color="warn"
        class="logout-btn"
        (click)="userService.logout(); closeMenu()"
      >
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  }
</nav>
