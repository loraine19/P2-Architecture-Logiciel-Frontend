<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and meta information -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO and Browser Configuration -->
    <title>Student Management System - Modern Angular Frontend</title>
    <meta
      name="description"
      content="Modern student management application built with Angular 18+, featuring responsive design and Material Design components."
    />
    <meta
      name="keywords"
      content="student management, Angular, education, frontend"
    />
    <meta name="author" content="Student Management Team" />

    <!-- Base URL for routing -->
    <base href="/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Google Fonts and Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Bootstrap CSS Framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Angular Application Root -->
    <app-root></app-root>

    <!-- Bootstrap JavaScript Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
